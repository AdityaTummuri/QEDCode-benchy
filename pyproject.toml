[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qedcode-benchy"
version = "0.1.0"
description = "Optional benchmarking companion for QEDCode: fair baseline-versus-QEDCode comparisons with an independent evaluator."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AdityaTummuri" }]
# Benchy is installed into the same environment as QEDCode (QEDCode manages it), so the
# `qedcode` package is expected to be importable. pytest runs the independent evaluator.
dependencies = [
    "qedcode>=0.1.0",
    "pytest>=8.0",
]

[project.scripts]
benchy = "benchy.cli:main"
qedcode-benchy = "benchy.cli:main"

[project.urls]
Homepage = "https://github.com/AdityaTummuri/QEDCode-benchy"
QEDCode = "https://github.com/AdityaTummuri/QEDCode"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["benchy"]

[tool.hatch.build.targets.wheel.force-include]
"suites" = "benchy/_suites"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["suites"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # scripted replies and fixtures are long on purpose
"tests/test_agent_mode.py" = ["E501", "F811"]  # reuses the `fake` fixture from test_swebench

[tool.pytest.ini_options]
testpaths = ["tests"]
