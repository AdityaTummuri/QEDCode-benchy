name: release

# Pushing a tag like v0.1.0 publishes qedcode-benchy to PyPI with trusted publishing (no stored
# token), so `qed benchy install` needs no git URL. One-time setup on PyPI: a pending publisher
# for the project `qedcode-benchy`, this repository, workflow `release.yml`, environment `pypi`.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: The tag must match the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"; exit 1
          fi
      - name: Test, then build
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip build
          .venv/bin/python -m pip install --quiet qedcode -e . ruff
          .venv/bin/python -m pytest -q
          .venv/bin/python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
