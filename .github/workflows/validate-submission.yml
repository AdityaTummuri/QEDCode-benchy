# Checks community-submission pull requests. Treats the pull request as untrusted DATA:
# the validator comes from the base branch and never runs code from the pull request.
# No secrets are used, the token is read-only, and merging still needs a maintainer's review.
name: validate-submission
on:
  pull_request:
    paths: ["results/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Trusted validator (base branch)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Pull request contents (read as data only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Make the base commit available for the diff
        run: git -C pr fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
      - name: Validate
        run: >
          python3 trusted/bot/validate_pr.py
          --pr pr
          --base-sha "${{ github.event.pull_request.base.sha }}"
          --summary "$GITHUB_STEP_SUMMARY"
