# After a reviewed submission is merged, regenerate the leaderboard and README statistics from
# the accepted records with the project's own (trusted) code. Runs only on the main branch.
name: update-results
on:
  push:
    branches: [main]
    paths: ["results/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-results
  cancel-in-progress: false
jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Regenerate aggregates
        run: python3 bot/aggregate.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- leaderboard README.md; then
            echo "Aggregates already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboard README.md
          git commit -m "Update community results from accepted submissions"
          git push
